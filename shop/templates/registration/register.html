{% extends 'base.html' %}
{% block title %}Register - Argus Bike Shop{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 15px;">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-block p-3 rounded-circle mb-3 shadow">
                <i class="fas fa-bicycle fa-2x"></i>
            </div>
            <h2 class="fw-bold text-dark">Create Account</h2>
            <p class="text-muted">Register to Argus Bike Shop</p>
        </div>
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="Enter username" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">First Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="first_name" class="form-control border-start-0 bg-light" placeholder="Enter first name" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Last Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="last_name" class="form-control border-start-0 bg-light" placeholder="Enter last name" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 bg-light" placeholder="Enter email" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password1" class="form-control border-start-0 bg-light" placeholder="Enter password" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password2" class="form-control border-start-0 bg-light" placeholder="Confirm password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-3" style="border-radius: 8px;">
                REGISTER
            </button>
        </form>
        <div class="text-center mt-3">
            <p class="small text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
